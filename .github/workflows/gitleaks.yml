name: Gitleaks

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --exit-code 1 /repo
