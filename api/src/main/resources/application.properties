spring.application.name=project03
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project03}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:project03}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:5}
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
