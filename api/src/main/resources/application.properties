spring.application.name=project03
auth.jwt-secret=${JWT_SECRET:}
auth.web-origin=${WEB_ORIGIN:http://localhost:8081}
auth.github.client-id=${GITHUB_CLIENT_ID:}
auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
auth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8081}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID:}
auth.google.android-client-secret=${GOOGLE_ANDROID_CLIENT_SECRET:}
auth.google.redirect-uri=${GOOGLE_REDIRECT_URIS:${GOOGLE_REDIRECT_URI:http://localhost:8081}}
auth.google.native-redirect-uri=${GOOGLE_NATIVE_REDIRECT_URI:seaanimaldiscovery:/oauthredirect}
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project03}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:project03}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:5}
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
