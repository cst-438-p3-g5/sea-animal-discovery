spring.application.name=project03
auth.jwt-secret=${JWT_SECRET:}
auth.web-origin=${WEB_ORIGIN:http://localhost:8081}
auth.github.client-id=${GITHUB_CLIENT_ID:}
auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
auth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8081}
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project03}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:project03}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:5}
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
