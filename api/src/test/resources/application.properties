spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
auth.jwt-secret=test-only-secret-at-least-32-bytes-long
auth.web-origin=http://localhost:8081
auth.github.client-id=test-client
auth.github.client-secret=test-secret
auth.github.redirect-uri=http://localhost:8081
spring.mvc.problemdetails.enabled=true
